[project]
name = "llm-memory-meter"
version = "1.0.0"
description = "Measure the real memory footprint of a local LLM from its official config.json — weights and KV cache, side by side with what the viral formula predicts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Carlos Ulisses Flores", email = "c.ulisses@gmail.com" }]
keywords = [
    "llm",
    "kv-cache",
    "quantization",
    "grouped-query-attention",
    "sliding-window-attention",
    "linear-attention",
    "local-inference",
    "reproducibility",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ulissesflores/llm-memory-meter"
Article = "https://ulissesflores.com/artigos/memoria-llm-local"
Repository = "https://github.com/ulissesflores/llm-memory-meter"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: test that reaches the Hugging Face Hub; excluded by default",
]

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
ignore-init-module = true
verbose = 1
